<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>RE → NFA Simulator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
  <div id="app">
    <h1>RE → NFA (Thompson) Simulator</h1>
    <div class="controls">
      <input id="regex-input" type="text" placeholder="Enter regular expression" value="" />
      <button id="insert-eps" data-testid="insert-eps" type="button" title="Insert ε">ε</button>
      <button id="insert-empty" data-testid="insert-empty" type="button" title="Insert ∅">∅</button>
      <select id="notation-select" data-testid="notation-select">
        <option value="standard">Standard (| is union)</option>
        <option value="textbook">Textbook (+ is union)</option>
      </select>
      <select id="concat-select" data-testid="concat-select">
        <option value="epsilon-link">ε-link</option>
        <option value="merge">Merge</option>
      </select>
      <button id="build-button">Build</button>
    </div>
    <div class="alphabet-controls">
      <label for="alphabet-input">Alphabet:</label>
      <input id="alphabet-input" data-testid="alphabet-input" type="text" placeholder="Inferred alphabet" />
      <div id="alphabet-message" data-testid="alphabet-message"></div>
    </div>
    <div id="error-message" data-testid="error-message"></div>
    <div id="stats" data-testid="stats"></div>
    <div id="token-list" data-testid="token-list"></div>
    <div id="postfix-view" data-testid="postfix-view"></div>
    <div id="tree-view" data-testid="tree-view"></div>
    <div class="stepper-controls" id="stepper-controls" data-testid="stepper-controls">
      <button id="step-first" data-testid="step-first" title="First step">|◀</button>
      <button id="step-prev" data-testid="step-prev" title="Previous step">◀</button>
      <button id="step-play" data-testid="step-play" title="Play">Play</button>
      <button id="step-next" data-testid="step-next" title="Next step">▶</button>
      <button id="step-last" data-testid="step-last" title="Last step">▶|</button>
      <span id="step-counter" data-testid="step-counter">step 0 / 0</span>
      <label for="step-speed">Speed:</label>
      <select id="step-speed" data-testid="step-speed">
        <option value="1500">0.5x</option>
        <option value="750" selected>1x</option>
        <option value="300">2x</option>
      </select>
    </div>
    <div id="step-log" data-testid="step-log"></div>
    <div id="layout-note" data-testid="layout-note"></div>
    <div id="canvas" data-testid="canvas"></div>
    <div id="transition-table" data-testid="transition-table"></div>
    <div class="simulation-controls">
      <textarea id="test-input" data-testid="test-input" placeholder="Enter test strings, one per line"></textarea>
      <button id="run-button" data-testid="run-button">Run</button>
    </div>
    <pre id="verdict" data-testid="verdict"></pre>
    <div id="trace" data-testid="trace"></div>
    <div id="worker-status" data-testid="worker-status"></div>

  </div>
  <script type="module" src="/src/ui/main.ts"></script>
</body>

</html>
